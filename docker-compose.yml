services:
  postgres:
    image: postgres:16-alpine
    container_name: ekofi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ekofi
    ports:
      - "5432:5432"
    volumes:
      - ekofi_pgdata:/var/lib/postgresql/data

volumes:
  ekofi_pgdata:
